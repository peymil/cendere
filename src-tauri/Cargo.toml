[package]
name = "tikistirici"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "tikistirici_lib"
crate-type = ["lib", "staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
png = "0.17"
oxipng = "9"
imagequant = "4"
fast_image_resize = "5"
rayon = "1"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
rustc-hash = "2"

[dev-dependencies]
tempfile = "3"
